name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Leave empty to use a SHA-derived dev tag."
        required: false

permissions:
  contents: write   # to create GitHub Releases
  packages: write   # to push to ghcr.io

env:
  IMAGE_NAME: kafka-lens

jobs:
  build:
    runs-on: ubuntu-latest
    # Hoist secrets to env at job scope so step-level `if:` conditions can
    # test for presence without referencing secrets directly (which is
    # restricted in some Actions contexts and trips the workflow validator).
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            VERSION="${INPUT_TAG#v}"
          else
            VERSION="0.0.0-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: env.DH_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose image tags
        id: tags
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          GHCR="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          TAGS="${GHCR}:${VERSION},${GHCR}:latest"
          if [[ -n "${DH_USER}" ]]; then
            DH="docker.io/${DH_USER}/${IMAGE_NAME}"
            TAGS="${TAGS},${DH}:${VERSION},${DH}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.title=Kafka Lens
            org.opencontainers.image.description=Self-hosted Kafka UI with free-text search, lag charts, and DLQ ops
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container images

            ```bash
            docker run -p 9192:9192 \
              -e CLUSTERS_0_ID=local \
              -e CLUSTERS_0_NAME='Local Kafka' \
              -e CLUSTERS_0_BOOTSTRAPSERVERS=host.docker.internal:9092 \
              ghcr.io/1989v/kafka-lens:${{ steps.ver.outputs.version }}
            ```

            Also available on Docker Hub as `nugaba/kafka-lens:${{ steps.ver.outputs.version }}` when the workflow has DOCKERHUB_USERNAME and DOCKERHUB_TOKEN configured.

            See [`README.md`](README.md) for full configuration and [`README.ko.md`](README.ko.md) for Korean.
