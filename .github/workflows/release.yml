name: release

# Multi-arch release pipeline.
#
# Three jobs run sequentially:
#  1. prepare   — resolve the version label once so every downstream job
#                 sees the same value.
#  2. build     — matrix over (linux/amd64 on ubuntu-latest) and
#                 (linux/arm64 on ubuntu-24.04-arm). Each runner builds
#                 natively (no QEMU), pushes its image **by digest only**
#                 to every configured registry, and uploads the digest as
#                 an artifact.
#  3. manifest  — downloads the digests and assembles one multi-arch
#                 manifest per registry with the `:VERSION` and `:latest`
#                 tags. Then cuts a GitHub Release on tag push.
#
# Why split this way: building natively per architecture is roughly
# 5-10× faster than QEMU emulation. The manifest step is cheap.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Leave empty to use a SHA-derived dev tag."
        required: false

permissions:
  contents: write   # to create GitHub Releases
  packages: write   # to push to ghcr.io

env:
  IMAGE_NAME: kafka-lens

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      repos: ${{ steps.repos.outputs.repos }}
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            VERSION="${INPUT_TAG#v}"
          else
            VERSION="0.0.0-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Compose image repos (comma-separated)
        id: repos
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPOS="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          if [[ -n "${DH_USER}" ]]; then
            REPOS="${REPOS},docker.io/${DH_USER}/${IMAGE_NAME}"
          fi
          echo "repos=${REPOS}" >> "$GITHUB_OUTPUT"
          echo "Repos: ${REPOS}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: env.DH_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ needs.prepare.outputs.repos }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.pair }}
          provenance: false
          labels: |
            org.opencontainers.image.title=Kafka Lens
            org.opencontainers.image.description=Self-hosted Kafka UI with free-text search, lag charts, and DLQ ops
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Export digest to artifact
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: env.DH_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create + push multi-arch manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          GHCR="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"

          GHCR_REFS=()
          for d in *; do
            [[ -e "$d" ]] || continue
            GHCR_REFS+=("${GHCR}@sha256:${d}")
          done
          echo "GHCR refs: ${GHCR_REFS[*]}"

          docker buildx imagetools create \
            -t "${GHCR}:${VERSION}" \
            -t "${GHCR}:latest" \
            "${GHCR_REFS[@]}"

          if [[ -n "${DH_USER}" ]]; then
            DH="docker.io/${DH_USER}/${IMAGE_NAME}"
            DH_REFS=()
            for d in *; do
              [[ -e "$d" ]] || continue
              DH_REFS+=("${DH}@sha256:${d}")
            done
            echo "Docker Hub refs: ${DH_REFS[*]}"
            docker buildx imagetools create \
              -t "${DH}:${VERSION}" \
              -t "${DH}:latest" \
              "${DH_REFS[@]}"
          fi

      - name: Inspect resulting manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools inspect "ghcr.io/${OWNER_LC}/${IMAGE_NAME}:${VERSION}" || true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container images

            Multi-arch (linux/amd64 + linux/arm64) — runs natively on Apple Silicon, Raspberry Pi 4+, OCI Ampere A1, etc.

            ```bash
            docker run -p 9192:9192 \
              -e CLUSTERS_0_ID=local \
              -e CLUSTERS_0_NAME='Local Kafka' \
              -e CLUSTERS_0_BOOTSTRAPSERVERS=host.docker.internal:9092 \
              ghcr.io/1989v/kafka-lens:${{ needs.prepare.outputs.version }}
            ```

            Also available on Docker Hub as `nugaba/kafka-lens:${{ needs.prepare.outputs.version }}` when DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are configured.

            See [`README.md`](README.md) for full configuration and [`README.ko.md`](README.ko.md) for Korean.
