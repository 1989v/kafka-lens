name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Leave empty to use the current commit SHA."
        required: false

permissions:
  contents: write   # to create GitHub Releases
  packages: write   # to push to ghcr.io

env:
  IMAGE_NAME: kafka-lens

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose image tags
        id: tags
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          GHCR="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          TAGS="${GHCR}:${{ steps.ver.outputs.version }},${GHCR}:latest"
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]]; then
            DH="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}"
            TAGS="${TAGS},${DH}:${{ steps.ver.outputs.version }},${DH}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.title=Kafka Lens
            org.opencontainers.image.description=Self-hosted Kafka UI with free-text search, lag charts, and DLQ ops
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Container images

            ```bash
            docker run -p 9192:9192 \
              -e CLUSTERS_0_ID=local \
              -e CLUSTERS_0_NAME='Local Kafka' \
              -e CLUSTERS_0_BOOTSTRAPSERVERS=host.docker.internal:9092 \
              ghcr.io/1989v/kafka-lens:${{ steps.ver.outputs.version }}
            ```

            Also available on Docker Hub when published.

            See [`README.md`](README.md) for full configuration and [`README.ko.md`](README.ko.md) for Korean.
