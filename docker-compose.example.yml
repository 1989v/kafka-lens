# Run from this directory:
#
#   docker compose -f docker-compose.example.yml up --build
#
# Spins up a local KRaft Kafka and Kafka Lens pointed at it. Kafka cluster
# configuration is injected via environment variables (provectus/kafka-ui
# style). For more advanced setups (SASL/SSL, multiple clusters, named DLQ
# patterns) you can mount a config.yml instead — see the commented block below.

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka-lens-kafka
    ports:
      - "29092:29092"   # host-side listener — use localhost:29092 from your host shell
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"

  kafka-lens:
    image: kafka-lens:dev
    build: .
    container_name: kafka-lens
    depends_on:
      - kafka
    ports:
      - "9192:9192"
    volumes:
      - kafka-lens-data:/app/data
    environment:
      # Use `${VAR:-default}` so values can be overridden from the host shell
      # without editing this file. Example:
      #   CLUSTERS_0_BOOTSTRAPSERVERS=b-1.prod.msk:9094 docker compose ... up
      #
      # ---- Cluster #0 ----
      CLUSTERS_0_ID: ${CLUSTERS_0_ID:-local}
      CLUSTERS_0_NAME: ${CLUSTERS_0_NAME:-Local Kafka (compose)}
      CLUSTERS_0_BOOTSTRAPSERVERS: ${CLUSTERS_0_BOOTSTRAPSERVERS:-kafka:9092}
      CLUSTERS_0_SECURITY_PROTOCOL: ${CLUSTERS_0_SECURITY_PROTOCOL:-PLAINTEXT}
      # CLUSTERS_0_SECURITY_SASLMECHANISM: AWS_MSK_IAM
      # CLUSTERS_0_SECURITY_SASLJAASCONFIG: 'software.amazon.msk.auth.iam.IAMLoginModule required;'
      # CLUSTERS_0_DLQNAMINGPATTERNS_0: '{topic}.DLT'
      # CLUSTERS_0_DLQNAMINGPATTERNS_1: 'dead-letter-{topic}'

      # ---- Add more clusters by incrementing the index ----
      # CLUSTERS_1_ID: staging
      # CLUSTERS_1_NAME: Staging MSK
      # CLUSTERS_1_BOOTSTRAPSERVERS: b-1.staging.kafka:9094,b-2.staging.kafka:9094

      AUTH_MODE: ${AUTH_MODE:-none}
      # Destructive topic ops (delete + add partitions) — keep OFF unless
      # operators explicitly need them. Default false.
      TOPICOPS_ALLOWDESTRUCTIVE: ${TOPICOPS_ALLOWDESTRUCTIVE:-false}
      STORAGE_SQLITEPATH: ${STORAGE_SQLITEPATH:-/app/data/kafka-lens.db}
      SCAN_MAXMESSAGESPERJOB: ${SCAN_MAXMESSAGESPERJOB:-100000}
      SCAN_MAXSCANDURATIONSECONDS: ${SCAN_MAXSCANDURATIONSECONDS:-120}

      # ---- Alternative: mount a YAML config file instead of env vars ----
      # Uncomment the volume below and the SPRING_CONFIG line, then put your
      # cluster definitions in config.yml (see config.example.yml).
      # SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config.yml

    # volumes:
    #   - ./config.yml:/app/config.yml:ro
    #   - kafka-lens-data:/app/data

volumes:
  kafka-lens-data:
