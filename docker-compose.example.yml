# Drop this file alongside a `config.yml` and run:
#   docker compose -f docker-compose.example.yml up
#
# This spins up a local Kafka (KRaft mode) and Kafka Lens pointed at it.

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka-lens-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"

  kafka-lens:
    image: ghcr.io/your-org/kafka-lens:latest
    container_name: kafka-lens
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - kafka-lens-data:/app/data
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config.yml

volumes:
  kafka-lens-data:
